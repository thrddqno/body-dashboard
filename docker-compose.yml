services:
  frontend:
    build:
      context: ./frontend
    container_name: body-dashboard-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  backend:
    build:
      context: ./backend
    container_name: body-dashboard-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Manila}
      DB_URL: jdbc:postgresql://postgres:5432/body_dashboard
      DB_USERNAME: body_dashboard
      DB_PASSWORD: body_dashboard
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      MCP_ENABLED: ${MCP_ENABLED:-false}

      AI_INTERPRETATION_PROVIDER: ${AI_INTERPRETATION_PROVIDER:-none}
      AI_INTERPRETATION_MODEL: ${AI_INTERPRETATION_MODEL:-}
      AI_INTERPRETATION_BASE_URL: ${AI_INTERPRETATION_BASE_URL:-https://api.openai.com/v1}
      AI_INTERPRETATION_API_KEY: ${AI_INTERPRETATION_API_KEY:-}
      AI_INTERPRETATION_TIMEOUT: ${AI_INTERPRETATION_TIMEOUT:-30s}

    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: body-dashboard-postgres
    environment:
      POSTGRES_DB: body_dashboard
      POSTGRES_USER: body_dashboard
      POSTGRES_PASSWORD: body_dashboard

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U body_dashboard -d body_dashboard"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
